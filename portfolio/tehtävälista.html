<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tehtävälista</title>
</head>
<body>

    <nav>
        <a href="index.html">Etusivu</a>
        <a href="tehtävälista.html">Tehtävälista</a>
    </nav>

    <h1>Tehtävälista</h1>

    <ul id="tehtavalista"></ul>

    <input type="text" id="uusiTehtava">
    <button onclick="lisaa()">Lisää</button>

    <script src="tehtavalista.js"></script>

     <style>
        body {
            margin: 0;
            min-height: 100vh;

            background-color: #f2f4f7;
            color: #140c0c;
            font-family: sans-serif;

            display: grid;

            grid-template-areas:
                "header header"
                "nav main"
                "footer footer";

            grid-template-columns: 220px 1fr;
            grid-template-rows: 80px 1fr 60px;
        }

        header {
            grid-area: header;

            background-color: #1377e9;
            color: white;

            padding: 20px;
        }

        nav {
            grid-area: nav;

            background-color: #0c0d0e;
            padding: 20px;

            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        nav li {
            margin-bottom: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            color: #66b3ff;
        }

        main {
            grid-area: main;

            padding: 20px;
        }

        video {
            max-width: 100%;
            height: auto;

            border-radius: 10px;
            margin-top: 20px;
        }

        footer {
            grid-area: footer;

            background-color: #003677;
            color: white;

            padding: 15px;

            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        footer a {
            color: white;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
    <nav>
        <a href="../cv.html">CV</a>
        <a href="../työkokemus.html">Työkokemus</a>
        <a href="index.html">Portfolio</a>
        <a href="keskustelu.html">keskustelu</a>
        <a href="tehtävälista.html">Tehtävälista</a>
    </nav>

</head>
</body>
</html>
